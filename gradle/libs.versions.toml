[versions]
kotlin = "2.4.21"
dokka = "2.2.0"
docker-compose = "0.17.21"
coroutines = "1.11.0"
serialization = "1.12.0"
kotlin-logging = "8.0.4"
serialization-extensions = "1.2.1"
postgresql = "42.7.14"
hikaricp = "7.1.0"
junit = "6.1.3"
kotest = "6.2.6"
slf4j = "2.0.20"
logback = "1.6.6"
kotlin4example = "1.1.9"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-slf4j = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
serialization-extensions = { module = "com.jillesvangurp:kotlinx-serialization-extensions", version.ref = "serialization-extensions" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
kotlin4example = { module = "com.github.jillesvangurp:kotlin4example", version.ref = "kotlin4example" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
docker-compose = { id = "com.avast.gradle.docker-compose", version.ref = "docker-compose" }
